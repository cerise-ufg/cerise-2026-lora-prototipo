; CERISE 2026 — Prototipo de comunicacao LoRa (Objetivo 3, Atividade 10)
;
; Papeis:  node    = lado drone (telemetria periodica, ACK + retentativas)
;          gateway = estacao de solo (recebe, valida, ACK, RSSI/SNR, JSON na serial, OLED)
; Placas:  Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)  -> principal
;          TTGO LoRa32 v2.1 (ESP32 + SX1276)            -> alternativa
;
; Compilar tudo:        pio run
; Testes nativos:       pio test -e native -v
; Gravar (exemplo):     pio run -e heltec_v3_node -t upload --upload-port COM5
; Monitor serial:       pio device monitor -e heltec_v3_gateway --port COM6

[platformio]
default_envs = heltec_v3_node, heltec_v3_gateway, ttgo_v21_node, ttgo_v21_gateway, heltec_v3_node_gps

; ---------------------------------------------------------------- base ESP32
[esp32_base]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
monitor_filters = time
lib_deps =
    jgromes/RadioLib@7.8.1
    olikraus/U8g2@2.36.18
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0
    ; parametros de radio (SF pode ser trocado em execucao pela serial: "SF 10")
    ; canal AU915 8 = 916,8 MHz (1o canal da sub-banda 2); CR 4/5; sync word privado 0x12
    -DLORA_AU915_CH=8
    -DLORA_SF=9
    -DLORA_BW_KHZ=125.0
    -DLORA_CR_DENOM=5
    -DLORA_TX_DBM=14
    -DLORA_PREAMBLE=8
    -DLORA_SYNC_WORD=0x12
    -DCERISE_NET_ID=42

[heltec_v3]
extends = esp32_base
board = heltec_wifi_lora_32_V3
build_flags = ${esp32_base.build_flags} -DBOARD_HELTEC_V3 -DRADIO_SX1262

[ttgo_v21]
extends = esp32_base
board = ttgo-lora32-v21
build_flags = ${esp32_base.build_flags} -DBOARD_TTGO_V21 -DRADIO_SX1276

; ---------------------------------------------------------------- ambientes
[env:heltec_v3_node]
extends = heltec_v3
build_src_filter = +<common/> +<node_main.cpp>
build_flags = ${heltec_v3.build_flags} -DROLE_NODE -DNODE_ID=1 -DHOST_UART1

[env:heltec_v3_gateway]
extends = heltec_v3
build_src_filter = +<common/> +<gateway_main.cpp>
build_flags = ${heltec_v3.build_flags} -DROLE_GATEWAY

[env:ttgo_v21_node]
extends = ttgo_v21
build_src_filter = +<common/> +<node_main.cpp>
build_flags = ${ttgo_v21.build_flags} -DROLE_NODE -DNODE_ID=2 -DHOST_UART1

[env:ttgo_v21_gateway]
extends = ttgo_v21
build_src_filter = +<common/> +<gateway_main.cpp>
build_flags = ${ttgo_v21.build_flags} -DROLE_GATEWAY

; no com GPS serial (NEO-6M/M8N) para geolocalizar cada pacote no teste de alcance
[env:heltec_v3_node_gps]
extends = heltec_v3
build_src_filter = +<common/> +<node_main.cpp>
build_flags = ${heltec_v3.build_flags} -DROLE_NODE -DNODE_ID=1 -DUSE_GPS
lib_deps =
    ${esp32_base.lib_deps}
    mikalhart/TinyGPSPlus@1.1.0

; ---------------------------------------------------------------- testes nativos (PC)
; requer gcc no PATH (no Windows foi usado o WinLibs GCC 16.2, ver README)
[env:native]
platform = native
test_framework = unity
build_flags = -Wall -Wextra -std=gnu11
